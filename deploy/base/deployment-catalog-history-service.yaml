---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-history-service
  labels:
    app: catalog-history-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-history-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: catalog-history-service
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: error-reporting-sa
      # Must exceed the preStop sleep.
      terminationGracePeriodSeconds: 45
      containers:
        - name: catalog-history-service
          image: catalog-history-service
          imagePullPolicy: Always
          # Keep accepting connections until the endpoint is detached from the NEG.
          lifecycle:
            preStop:
              sleep:
                seconds: 30
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
